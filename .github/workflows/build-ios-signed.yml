name: Build iOS App (Signed)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      signing:
        description: 'Enable code signing'
        required: true
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.24.0'
  BUNDLE_ID: 'com.nebula.clashmi'

jobs:
  build-signed-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event.inputs.signing == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Import signing certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate and provisioning profile
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Install provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

    - name: Fix iOS project configuration
      run: |
        cd ios
        plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" Runner/Info.plist
        plutil -replace PRODUCT_BUNDLE_IDENTIFIER -string "$BUNDLE_ID" Runner.xcodeproj/project.pbxproj
        cd ..

    - name: Install dependencies
      run: |
        flutter pub get
        cd ios
        pod install
        cd ..

    - name: Build signed IPA
      run: |
        flutter build ios --release --codesign
        mkdir -p build/ios/ipa

        # Export IPA using xcodebuild
        xcodebuild -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath build/ios/Runner.xcarchive \
          archive

        xcodebuild -exportArchive \
          -archivePath build/ios/Runner.xcarchive \
          -exportPath build/ios/ipa \
          -exportOptionsPlist ios/ExportOptions.plist

    - name: Upload signed IPA
      uses: actions/upload-artifact@v4
      with:
        name: signed-ipa
        path: build/ios/ipa/*.ipa
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: build/ios/ipa/*.ipa
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-multiplatform:
    runs-on: macos-latest
    timeout-minutes: 180
    needs: build-signed-ios
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Build for all platforms
      run: |
        flutter pub get

        # iOS
        echo "🍎 Building iOS..."
        flutter build ios --release --no-codesign

        # macOS
        echo "🖥️ Building macOS..."
        flutter build macos --release

        # Android APK
        echo "🤖 Building Android APK..."
        flutter build apk --release

        # Android AAB
        echo "📦 Building Android AAB..."
        flutter build appbundle --release

    - name: Package all builds
      run: |
        mkdir -p release
        cp -r build/ios/iphoneos build/macos/Build/Products/Release build/app/outputs/flutter-apk build/app/outputs/bundle/release release/

        # Create checksums
        cd release
        find . -type f -exec shasum -a 256 {} \; > checksums.txt
        cd ..

    - name: Upload multiplatform build
      uses: actions/upload-artifact@v4
      with:
        name: clashmi-multiplatform-${{ github.ref_name }}
        path: release/
        retention-days: 90